name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Generate app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets-src/icon.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 assets-src/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 assets-src/icon-background.svg -o assets/icon-background.png
          npx --yes @capacitor/assets generate --android
      - run: chmod +x android/gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mahmoud-zarzoura-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
